name: captable
services:
  app:
    build:
      target: deps
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: captable-app
    depends_on:
      - pg
      - smtp
      - s3
    restart: always
    ports:
      - 3000:3000
    env_file:
      - ".env"
    working_dir: /app
    command: [/bin/sh, -c, "pnpm install && pnpm dev"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.pnpm-store

  studio:
    build:
      target: deps
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: captable-studio
    depends_on:
      - pg
      - smtp
      - s3
    restart: always
    ports:
      - 5555:5555
    env_file:
      - ".env"
    working_dir: /app
    command: [/bin/sh, -c, "pnpm install && pnpm db:studio"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.pnpm-store

  pg:
    image: postgres:15
    container_name: captable-database
    environment:
      - POSTGRES_USER=captable
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=captable
      - POSTGRES_EXTENSIONS=pgcrypto
    ports:
      - 54321:5432
    volumes:
      - postgres:/var/lib/postgresql/data

  smtp:
    image: axllent/mailpit
    container_name: captable-smtp
    ports:
      - 8025:8025
      - 1025:1025

  s3:
    image: ghcr.io/hanzoai/s3:v1.0.14
    platform: linux/amd64
    container_name: captable-s3
    # Dev sizing: each bucket preallocates 7 volumes, so the image default of
    # 8 volumes x 30GB cannot hold two buckets. 1GB volumes, count from disk.
    command: server -s3 -s3.port=9000 -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - 9000:9000
    volumes:
      - s3:/data
    environment:
      - AWS_ACCESS_KEY_ID=captable
      - AWS_SECRET_ACCESS_KEY=password
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, "http://127.0.0.1:9000/status"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Creates the captable buckets. Runs once and exits 0.
  s3-init:
    image: amazon/aws-cli:latest
    container_name: captable-s3-init
    depends_on:
      s3:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=captable
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://s3:9000
    entrypoint: sh
    command: |
      -c "
        aws s3api head-bucket --bucket captable-private-bucket 2>/dev/null || aws s3 mb s3://captable-private-bucket;
        aws s3api head-bucket --bucket captable-public-bucket 2>/dev/null || aws s3 mb s3://captable-public-bucket;
        aws s3api put-bucket-acl --bucket captable-public-bucket --acl public-read;
      "
volumes:
  s3:
  postgres:
